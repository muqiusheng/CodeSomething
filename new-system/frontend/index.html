<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f7f3f1"/><title>CodeSomething · 学习工作台</title><script>try{var t=localStorage.getItem('cs-theme');var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light';document.querySelector('meta[name="theme-color"]').content=d?'#09002f':'#f7f3f1'}catch(e){document.documentElement.dataset.theme='light'}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
