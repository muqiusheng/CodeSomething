spring.application.name=codesomething-backend
server.address=127.0.0.1
server.port=${CS_BACKEND_PORT:5188}
cs.data-directory=${CS_DATA_DIRECTORY:runtime/data}
spring.datasource.url=jdbc:sqlite:${cs.data-directory}/codesomething.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
cs.frontend-origin=${CS_FRONTEND_ORIGIN:http://127.0.0.1:5178}
cs.ide.executable=${CS_IDEA_EXECUTABLE:}
cs.runner.enabled=${CS_RUNNER_ENABLED:true}
cs.runner.docker=${CS_DOCKER_BIN:C:/Users/lenovo/AppData/Local/Programs/DockerDesktop/resources/bin/docker.exe}
cs.runner.timeout-seconds=${CS_CHECK_TIMEOUT_SECONDS:45}
cs.tutor.binary=${CS_CODEX_BIN:codex}
cs.tutor.timeout-seconds=${CS_TUTOR_TIMEOUT_SECONDS:120}
