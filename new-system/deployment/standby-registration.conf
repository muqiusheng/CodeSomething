error_page 418 = @registration_on_primary;
if ($standby_registration_write) { return 418; }

location = /register {
    return 302 https://try.maqibu.online/register;
}

location = /admin/users {
    if ($arg_invite = 1) {
        return 302 https://try.maqibu.online/admin/users?invite=1;
    }
    expires -1;
    try_files /app.html =404;
}

location @registration_on_primary {
    default_type application/json;
    return 409 '{"code":"REGISTRATION_PRIMARY_ONLY","message":"请前往 try.maqibu.online 注册或创建邀请码。","details":{"registrationUrl":"https://try.maqibu.online/register"}}';
}
