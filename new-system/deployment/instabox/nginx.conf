limit_req_zone $binary_remote_addr zone=api_rate:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;
map_hash_bucket_size 128;
map $http_x_codesomething_ingress $via_domain_gateway {
    default 0;
    "${CS_INGRESS_TOKEN}" 1;
}

map "${CS_PUBLIC_HOST}:${CS_ALLOW_INDEXING}:$via_domain_gateway" $cs_index_site {
    default 0;
    "try.maqibu.online:1:1" 1;
}

# Keep the original request path through try_files and internal redirects.
map "$cs_index_site:$request_uri" $cs_robots_tag {
    default "noindex, nofollow, noarchive";
    ~^1:/(?:\\?.*)?$ "";
}

server {
    listen 8080 default_server;
    server_name ${CS_PUBLIC_HOST};
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag $cs_robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; img-src 'self' data:; frame-ancestors 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" always;

    root /usr/share/nginx/html;
    client_max_body_size 10m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    # The configured schedule can still probe the provider's HTTPS URL.
    location = /api/v1/health {
        proxy_pass http://backend:5188;
    }

    location ^~ /api/v1/internal/java-judge/ {
        if ($via_domain_gateway = 1) { return 404; }
        client_max_body_size 512k;
        limit_req zone=api_rate burst=5 nodelay;
        proxy_pass http://backend:5188;
    }

    location /api/ {
        if ($via_domain_gateway = 0) { return 409; }
        limit_req zone=api_rate burst=40 nodelay;
        limit_conn api_connections 32;
        proxy_pass http://backend:5188;
        proxy_http_version 1.1;
        proxy_set_header Host ${CS_PUBLIC_HOST};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 190s;
    }

    location /assets/ {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        expires 1y;
        try_files $uri =404;
    }

    location = / {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        expires -1;
        try_files /index.html =404;
    }

    location = /robots.txt {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        if ($cs_index_site = 0) { return 200 "User-agent: *\nDisallow: /\n"; }
        default_type text/plain;
        expires -1;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        expires -1;
        try_files $uri =404;
    }

    location = /BingSiteAuth.xml {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        expires -1;
        try_files $uri =404;
    }

    location ~ ^/favicon\.(?:ico|svg)$ {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        expires -1;
        try_files $uri =404;
    }

    location = /theme-init.js {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}/; }
        absolute_redirect off;
        return 308 /;
    }

    location / {
        if ($via_domain_gateway = 0) { return 302 https://${CS_PUBLIC_HOST}$request_uri; }
        expires -1;
        try_files /app.html =404;
    }
}
