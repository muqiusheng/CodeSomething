# Instabox's public proxy adds its own robots header. The custom domain
# decides indexing from the original request path at its HTTPS gateway.
map $request_uri $cs_gateway_robots_tag {
    default "noindex, nofollow, noarchive";
    ~^/(?:\\?.*)?$ "";
}

# The gateway container runs in UTC. Beijing 05:00–13:00 is UTC 21:00–05:00.
# Beijing 15:00–23:00 is UTC 07:00–15:00. Fail closed on an unexpected offset.
map $time_iso8601 $cs_after_hours {
    ~T(?:0[0-4]|0[7-9]|1[0-4]|2[1-3]):.*[+]00:00$ 0;
    default 1;
}

server {
    listen 8443 ssl default_server;
    server_name try.maqibu.online;
    if ($host != try.maqibu.online) { return 421; }
    if ($cs_after_hours) { return 418; }
    error_page 418 = @service_closed;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-CodeSomething-Origin instabox always;
    add_header X-Robots-Tag $cs_gateway_robots_tag always;

    client_max_body_size 10m;
    client_body_timeout 15s;
    resolver 127.0.0.11 ipv6=off valid=60s;
    resolver_timeout 5s;

    set $origin_host 17680-agradt36n3vvt65lozxjnwr6uq.instabox.tech;
    proxy_ssl_server_name on;
    proxy_ssl_name $origin_host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_http_version 1.1;
    proxy_set_header Host $origin_host;
    proxy_set_header X-CodeSomething-Ingress "${CS_INGRESS_TOKEN}";
    # Optional root-owned include for the private Instabox port credential.
    include /etc/nginx/maqibu-origin/*.conf;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_connect_timeout 12s;
    proxy_read_timeout 190s;
    proxy_hide_header X-Robots-Tag;

    location / {
        proxy_pass https://$origin_host$request_uri;
    }

    location @service_closed {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-CodeSomething-Origin gateway-schedule always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 503 "学习服务时段为北京时间每天 05:00–13:00、15:00–23:00（UTC 21:00–次日 05:00、07:00–15:00）。请在服务时段访问。";
    }
}
