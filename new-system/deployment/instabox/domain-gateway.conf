# Instabox's public proxy adds its own robots header. The custom domain
# decides indexing from the original request path at its HTTPS gateway.
map $request_uri $cs_gateway_robots_tag {
    default "noindex, nofollow, noarchive";
    ~^/(?:\\?.*)?$ "";
}

server {
    listen 8443 ssl default_server;
    server_name try.maqibu.online;
    if ($host != try.maqibu.online) { return 421; }
    server_tokens off;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-CodeSomething-Origin instabox always;
    add_header X-Robots-Tag $cs_gateway_robots_tag always;

    client_max_body_size 10m;
    client_body_timeout 15s;
    resolver 127.0.0.11 ipv6=off valid=60s;
    resolver_timeout 5s;

    set $origin_host 17680-agradt36n3vvt65lozxjnwr6uq.instabox.tech;
    proxy_ssl_server_name on;
    proxy_ssl_name $origin_host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_http_version 1.1;
    proxy_set_header Host $origin_host;
    proxy_set_header X-CodeSomething-Ingress "${CS_INGRESS_TOKEN}";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_connect_timeout 12s;
    proxy_read_timeout 190s;
    proxy_hide_header X-Robots-Tag;

    # The standby serves only landing resources. Account and workbench routes
    # always use the primary.
    location ~ ^/(?:robots\.txt|sitemap\.xml|BingSiteAuth\.xml|theme-init\.js|favicon\.svg|assets/[A-Za-z0-9_.-]+)?$ {
        proxy_intercept_errors on;
        error_page 409 502 503 504 = @public_standby;
        proxy_pass https://$origin_host$request_uri;
    }

    location / {
        proxy_pass https://$origin_host$request_uri;
    }

    location @public_standby {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $standby_host "${CS_STANDBY_HOST}";
        proxy_pass https://$standby_host$request_uri;
        proxy_ssl_name $standby_host;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $standby_host;
        proxy_set_header Authorization "Bearer ${CS_STANDBY_TOKEN}";
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header X-CodeSomething-Origin maqibu-standby always;
        add_header X-Robots-Tag $cs_gateway_robots_tag always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    }
}
